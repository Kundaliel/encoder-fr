<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>encoder fr</title>
  <style>
    body {
      margin: 1rem;
    }

    h1 {
      margin: 0 0 1rem 0;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: start;
    }

    fieldset {
      min-width: 0;
      padding: 1rem;
    }

    label,
    button,
    progress,
    input[type="file"],
    select {
      display: block;
      margin: 0.5rem 0;
    }


    progress {
      width: 100%;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0.5rem 0;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0.5rem 0;
    }

    a {
      display: inline-block;
      margin: 0.5rem 0;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <fieldset id="left">
      <input id="file" type="file">
      <div id="encodeOptions">
        <label>Data bits per color channel
          <select id="bits">
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
            <option>4</option>
          </select>
        </label>
        <label><input id="compact" type="checkbox"> Compact it?</label>
      </div>
      <button id="start" type="button">Start</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </fieldset>

    <fieldset id="right">
      <progress id="bar" max="100" value="0"></progress>
      <pre id="status">You gotta <abbr title="Geometry Dash Reference">Press Start</abbr>.</pre>
      <a id="download" hidden>Download</a>
      <img id="preview" alt="" hidden>
    </fieldset>
  </main>

  <script src="file2image.min.js"></script>
</body>

</html>
